name: Build Windows EXE (Optimized)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies & UPX
      run: |
        python -m pip install --upgrade pip
        pip install Pillow pyinstaller pystray
        choco install upx -y

    - name: Generate Moon Icon File
      shell: bash
      run: |
        python -c "from PIL import Image, ImageDraw
        img = Image.new('RGBA', (256, 256), (0, 0, 0, 0))
        draw = ImageDraw.Draw(img)
        draw.ellipse((8, 8, 248, 248), fill=(255, 235, 150, 80))
        draw.ellipse((16, 16, 240, 240), fill='#FDD835', outline='#FBC02D', width=6)
        draw.ellipse((50, 70, 100, 120), fill='#F0C419')
        draw.ellipse((140, 50, 180, 90), fill='#F0C419')
        draw.ellipse((120, 140, 190, 210), fill='#F0C419')
        draw.ellipse((70, 160, 110, 200), fill='#F0C419')
        draw.ellipse((175, 115, 215, 155), fill='#F0C419')
        img.save('moon.ico', format='ICO', sizes=[(16, 16), (32, 32), (48, 48), (64, 64), (128, 128), (256, 256)])"

    - name: Build Lightweight EXE
      shell: pwsh
      run: |
        $buildArgs = @(
          "-w",
          "-F",
          "--icon=moon.ico",
          "--hidden-import=pystray._win32",
          "-n", "Moon's Capture",
          "--exclude-module", "unittest",
          "--exclude-module", "email",
          "--exclude-module", "http",
          "--exclude-module", "xml",
          "--exclude-module", "pydoc",
          "--exclude-module", "sqlite3",
          "--exclude-module", "ssl",
          "--exclude-module", "bz2",
          "--exclude-module", "lzma",
          "--exclude-module", "tkinter.test",
          "capture.py"
        )
        pyinstaller @buildArgs

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: "Moon's Capture"
        path: dist/*.exe
